<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Wako K. — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="160" fill="#a371f7" fill-opacity="0.08"/>
  <circle cx="1120" cy="260" r="110" fill="#58a6ff" fill-opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" font-size="64" font-weight="700" fill="#f0f6fc">Wako K.</text>
    <rect x="82" y="150" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="200" font-size="30" font-weight="500" fill="#c9d1d9">Software Engineer</text>
    <text x="80" y="244" font-size="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">React · Angular · Node.js · TypeScript · Python · AWS</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="700" fill="url(#accent)" fill-opacity="0.9">
    <text x="1010" y="182" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
